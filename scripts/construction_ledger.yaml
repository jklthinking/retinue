- file: server/membership.py
  entity: Node
  contexts:
  - admit_node
  decider: administrator-session
  reason: admit_node is the single place a node joins the roster, reached from the
    administrative admission route and from proposal approval. Both require an administrator
    session, and the row records who admitted it and when. Every other path was removed
    so this one could be the only one.

sites:
- file: server/engine.py
  entity: Task
  contexts:
  - create_task
  decider: scoped-credential
  reason: The single funnel for card creation. Every caller is an authenticated surface
    (task router, sessions router, dispatch) where the principal's token or session
    names created_by, the publisher must be a roster actor, and the first chain event
    attributes the publication to them. Publishing a card is that credential-holder's
    decision.
- file: server/main.py
  entity: Actor
  contexts:
  - cmd_import_yaml
  - cmd_init_admin
  decider: operator-command
  reason: init-admin and import-yaml run only when an operator types the command against
    a chosen data directory; creating the admin's actor row or the actors named by
    legacy YAML cards is the content of that command, not a side effect of some other
    activity.
- file: server/main.py
  entity: ApiToken
  contexts:
  - cmd_issue_token
  decider: operator-command
  reason: issue-token runs only at an operator's shell, requires the target actor
    to exist already, and prints the token exactly once; issuing the credential is
    the decision the command exists to record.
- file: server/main.py
  entity: Node
  contexts:
  - cmd_issue_node_token
  decider: operator-command
  reason: issue-node-token runs only at an operator's shell and records the admission
    decision (admitted_by) alongside the credential; admitting the machine is the
    explicit purpose of the command.
- file: server/main.py
  entity: NodeToken
  contexts:
  - cmd_issue_node_token
  decider: operator-command
  reason: 'Same command, same decision: the operator names the node and the credential
    is written once to an operator-chosen file with owner-only permissions.'
- file: server/main.py
  entity: Task
  contexts:
  - cmd_import_yaml
  decider: operator-command
  reason: import-yaml runs only when an operator points it at a directory of legacy
    file-bus cards; importing those cards, with their chains preserved, is the decision
    the command exists to carry out.
- file: server/main.py
  entity: User
  contexts:
  - cmd_init_admin
  decider: operator-command
  reason: init-admin runs only at an operator's shell and refuses an existing username;
    creating the first administrator account is the explicit purpose of typing it.
- file: server/routers/actors.py
  entity: Actor
  contexts:
  - create_actor
  decider: administrator-session
  reason: POST /api/actors is guarded by require_admin, so an authenticated administrator
    session decides every roster addition, and the route refuses duplicates rather
    than upserting behind anyone's back.
- file: server/routers/admin.py
  entity: Actor
  contexts:
  - admin_prepare_onboarding
  decider: administrator-session
  reason: The onboarding route is guarded by require_admin; registering the new agent's
    actor row is the decision an administrator makes when they prepare an onboarding,
    and the route refuses an existing actor id.
- file: server/routers/admin.py
  entity: ApiToken
  contexts:
  - admin_create_token
  - admin_prepare_onboarding
  - admin_rotate_token
  decider: administrator-session
  reason: All three routes are guarded by require_admin and show the token exactly
    once; an administrator session decides each credential issuance, and rotation
    additionally disables the credential it replaces in the same decision.
- file: server/routers/admin.py
  entity: NodeToken
  contexts:
  - admin_create_node_token
  decider: administrator-session
  reason: Guarded by require_admin and refused for retired nodes; an administrator
    session decides each node credential.
- file: server/routers/admin.py
  entity: User
  contexts:
  - admin_create_user
  - admin_prepare_onboarding
  decider: administrator-session
  reason: Both routes are guarded by require_admin and refuse existing usernames;
    an administrator session decides each account creation.
- file: server/routers/knowledge.py
  entity: KnowledgeSource
  contexts:
  - post_knowledge
  decider: administrator-session
  reason: POST /api/knowledge is guarded by require_admin; cataloguing a knowledge
    asset is an administrator's decision, and the route updates in place rather than
    duplicating an existing name.
- file: server/routers/auth.py
  entity: WebSession
  contexts:
  - login
  decider: scoped-credential
  reason: A session row is created only after the account's own password verifies,
    under the login throttle; the credential presented is scoped to exactly the account
    the session record belongs to.
- file: server/routers/auth.py
  entity: WebSession
  contexts:
  - demo_login
  decider: operator-command
  reason: Demo login exists only when the operator has set demo_user in the site configuration,
    and it can only open sessions for that one configured account; the operator's
    configuration is the decision.
- file: server/routers/skills.py
  entity: Skill
  contexts:
  - post_skill
  decider: scoped-credential
  reason: POST /api/skills requires an authenticated principal; an agent caller is
    recorded as the skill's owner and only owners may update it later, so the credential
    that creates the skill is scoped to what it creates.
- file: server/skill_ops.py
  entity: Skill
  contexts:
  - import_runtime_skill
  decider: scoped-credential
  reason: Runtime import records the calling principal as imported_by and keeps a
    sanitized source snapshot; only that authenticated identity may create or refresh
    the catalog row.
- file: server/skill_ops.py
  entity: SkillBinding
  contexts:
  - bind_skill
  decider: scoped-credential
  reason: bind_skill is the single funnel for actor-skill assignments. Callers are
    an administrator session, the demo seeder, or the pilot-binding route, and the
    write identity is stored on the binding and on the append-only event chain.
- file: server/seed.py
  entity: Actor
  contexts:
  - seed_demo
  decider: operator-command
  reason: seed_demo runs only under the explicit seed-demo subcommand against an operator-chosen
    data directory, and writes clearly-labelled synthetic demo actors; the operator
    typing the command decides.
- file: server/seed.py
  entity: KnowledgeSource
  contexts:
  - seed_demo
  decider: operator-command
  reason: 'Same command, same decision: synthetic demo knowledge assets exist only
    because an operator ran seed-demo.'
- file: server/seed.py
  entity: Node
  contexts:
  - seed_demo
  decider: operator-command
  reason: 'Same command, same decision: demo nodes are admitted_by ''seed-demo'' and
    exist only because an operator ran seed-demo.'
- file: server/seed.py
  entity: Skill
  contexts:
  - seed_demo
  decider: operator-command
  reason: 'Same command, same decision: synthetic demo skills exist only because an
    operator ran seed-demo.'
- file: server/seed.py
  entity: User
  contexts:
  - seed_demo
  decider: operator-command
  reason: 'Same command, same decision: demo accounts exist only because an operator
    ran seed-demo against a data directory they chose.'
- file: tools/teacher_worker.py
  entity: ApiToken
  contexts:
  - bootstrap_tokens
  decider: operator-command
  reason: bootstrap_tokens runs only under the worker's explicit --bootstrap-tokens
    flag, requires each teacher actor to exist already, and writes one owner-only
    token file per actor; the operator running the pilot decides.

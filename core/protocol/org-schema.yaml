$schema: "https://json-schema.org/draft/2020-12/schema"
title: Retinue organization
type: object
required: [org, departments, agents, nodes]
properties:
  org: {type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'}
  departments:
    type: array
    items:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        im_channel: {type: string}
        lead: {type: string}
  agents:
    type: array
    items:
      type: object
      required: [id, dept, runtime, node]
      properties:
        id: {type: string}
        dept: {type: string}
        runtime: {type: string}
        model: {type: string}
        node: {type: string}
        on_claim:
          oneOf:
            - {type: string, minLength: 1}
            - type: array
              minItems: 1
              items: {type: string, minLength: 1}
        im:
          type: object
          properties:
            feishu:
              type: object
              properties:
                mention_id_env: {type: string, minLength: 1}
  nodes:
    type: array
    items:
      type: object
      required: [id]
      properties:
        id: {type: string}
  adapters:
    type: object
    properties:
      feishu:
        type: object
        properties:
          enabled: {type: boolean}
          chat_id_env: {type: string}
          profile_env: {type: string}
          self_mention_id_env: {type: string}
          allow_from_env: {type: string}
          dispatch_url_env: {type: string}
          dispatch_senders_env: {type: string}
          event_command:
            oneOf:
              - {type: string}
              - type: array
                items: {type: string}
